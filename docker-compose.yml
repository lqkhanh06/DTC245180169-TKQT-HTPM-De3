services:
  # ========================================================
  # 1. DATABASE SERVICE (MySQL 8.0)
  # ========================================================
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================================================
  # 2. WEB APPLICATION SERVICE (WordPress)
  # ========================================================
  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - frontend_net
      - backend_net

  # ========================================================
  # 3. DATABASE MANAGEMENT TOOL (phpMyAdmin)
  # ========================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_tool
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      UPLOAD_LIMIT: 64M
    networks:
      - frontend_net
      - backend_net

  # ========================================================
  # 4. REVERSE PROXY & SECURITY (Nginx)
  # ========================================================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
      - monitoring_net
    depends_on:
      - wordpress
      - phpmyadmin

  # ========================================================
  # 5. EXPORTERS (Giám sát Web, DB, Container)
  # ========================================================
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx_proxy:80/stub_status
    networks:
      - frontend_net
      - monitoring_net
    depends_on:
      - nginx

  mysql_exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql_exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysql-exporter.cnf
      - --no-collect.slave_status
    volumes:
      - ./mysql-exporter.cnf:/etc/mysql-exporter.cnf:ro
    networks:
      - backend_net
      - monitoring_net
    depends_on:
      mysql:
        condition: service_healthy

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    networks:
      - monitoring_net

  # ========================================================
  # 6. PROMETHEUS (Thu thập & Lưu trữ time-series metrics)
  # ========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_srv
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_net

  # ========================================================
  # 7. LOGGING SYSTEM (Loki + Promtail)
  # ========================================================
  loki:
    image: grafana/loki:latest
    container_name: loki_srv
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring_net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail_agent
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - nginx_logs:/var/log/nginx:ro
    networks:
      - monitoring_net
    depends_on:
      - loki

  # ========================================================
  # 8. GRAFANA (Giao diện hiển thị Dashboard & LogQL)
  # ========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki

# ========================================================
# NETWORKS CONFIGURATION (Network Isolation - Hardening)
# ========================================================
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

# ========================================================
# VOLUMES CONFIGURATION (Persistent Storage)
# ========================================================
volumes:
  mysql_data:
  wordpress_data:
  prometheus_data:
  grafana_data:
  nginx_logs:
  loki_data:
