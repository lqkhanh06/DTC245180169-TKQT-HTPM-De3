global:
  scrape_interval: 15s     # Tần suất thu thập metrics (15 giây/lần)
  evaluation_interval: 15s

scrape_configs:
  # 1. Giám sát chính Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Giám sát Web Server (Nginx qua nginx-exporter)
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx_exporter:9113"]

  # 3. Giám sát Database (MySQL qua mysqld-exporter)
  - job_name: "mysql"
    static_configs:
      - targets: ["mysql_exporter:9104"]

  # 4. Giám sát Tài nguyên Container / Host (Node Exporter)
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]
